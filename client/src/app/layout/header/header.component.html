<header class="fixed top-0 z-40 w-full border-b border-gray-100 bg-white/95 shadow-sm backdrop-blur-md">
  <div class="mx-auto flex h-20 max-w-screen-2xl items-center justify-between gap-6 px-4 sm:px-6 lg:px-8">

    <!-- Logo -->
    <a routerLink="/" class="flex shrink-0 items-center">
      <img src="/images/logo.png" alt="App logo"
        class="h-14 w-auto object-contain transition-transform duration-200 hover:scale-105" />
    </a>

    <!-- Desktop Navigation -->
    <nav class="hidden items-center gap-2 md:flex">
      <a routerLink="/" routerLinkActive="!text-indigo-600 after:scale-x-100" [routerLinkActiveOptions]="{exact: true}"
        class="relative px-4 py-2 text-sm font-semibold text-gray-600 transition-colors duration-200 after:absolute after:bottom-0 after:left-4 after:right-4 after:h-0.5 after:scale-x-0 after:rounded-full after:bg-indigo-600 after:transition-transform hover:text-indigo-600">
        Home
      </a>

      <a routerLink="/shop" routerLinkActive="!text-indigo-600 after:scale-x-100"
        class="relative px-4 py-2 text-sm font-semibold text-gray-600 transition-colors duration-200 after:absolute after:bottom-0 after:left-4 after:right-4 after:h-0.5 after:scale-x-0 after:rounded-full after:bg-indigo-600 after:transition-transform hover:text-indigo-600">
        Shop
      </a>

      <a routerLink="/test-error" routerLinkActive="!text-indigo-600 after:scale-x-100"
        class="relative px-4 py-2 text-sm font-semibold text-gray-600 transition-colors duration-200 after:absolute after:bottom-0 after:left-4 after:right-4 after:h-0.5 after:scale-x-0 after:rounded-full after:bg-indigo-600 after:transition-transform hover:text-indigo-600">
        Errors
      </a>
    </nav>

    <!-- Actions -->
    <div class="flex shrink-0 items-center gap-2 sm:gap-4">

      <!-- Shopping Cart -->
      <a routerLink="/cart" routerLinkActive="cart-active" aria-label="Shopping cart"
        [matBadge]="cartService.itemCount()" [matBadgeHidden]="cartService.itemCount() === 0" matBadgeSize="small"
        matBadgeColor="warn"
        class="flex h-11 w-11 items-center justify-center rounded-full text-gray-600 transition-all duration-200 hover:bg-indigo-50 hover:text-indigo-600">
        <mat-icon class="!m-0">shopping_cart</mat-icon>
      </a>

      <div class="h-8 w-px bg-gray-200"></div>

      <!-- Authenticated User -->
      @if(accountService.currentUser()) {
      <button mat-button [matMenuTriggerFor]="menu"
        class="!h-11 !rounded-full !px-3 transition-colors hover:!bg-gray-100">
        <span class="mr-1 flex h-8 w-8 items-center justify-center rounded-full bg-indigo-100 text-indigo-700">
          <mat-icon class="!m-0 !text-xl">person</mat-icon>
        </span>

        <span class="hidden max-w-40 truncate text-sm font-medium text-gray-700 sm:inline">
          {{accountService.currentUser()?.email}}
        </span>

        <mat-icon class="!ml-1 !mr-0 !text-gray-500">keyboard_arrow_down</mat-icon>
      </button>
      } @else {
      <div class="flex items-center gap-2">
        <a mat-button routerLink="/account/login" class="!rounded-full !px-3 !text-sm !font-semibold !text-gray-700">
          Login
        </a>

        <a mat-flat-button color="primary" routerLink="/account/register"
          class="!rounded-full !px-4 !text-sm !font-semibold">
          Register
        </a>
      </div>
      }
    </div>
  </div>

  <!-- Mobile Navigation -->
  <nav class="flex items-center justify-center gap-2 border-t border-gray-100 px-3 py-2 md:hidden">
    <a routerLink="/" routerLinkActive="mobile-active" [routerLinkActiveOptions]="{exact: true}"
      class="rounded-full px-4 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-indigo-50">
      Home
    </a>

    <a routerLink="/shop" routerLinkActive="mobile-active"
      class="rounded-full px-4 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-indigo-50">
      Shop
    </a>

    <a routerLink="/test-error" routerLinkActive="mobile-active"
      class="rounded-full px-4 py-2 text-sm font-medium text-gray-600 transition-colors hover:bg-indigo-50">
      Errors
    </a>
  </nav>
</header>

<!-- Loading Indicator -->
@if(busyService.loading) {
<mat-progress-bar mode="indeterminate" color="primary" class="!fixed !top-20 !z-50" />
}

<!-- User Menu -->
<mat-menu #menu="matMenu" xPosition="before" class="mt-2">
  <div class="border-b border-gray-100 px-4 py-3">
    <p class="text-xs font-medium uppercase tracking-wider text-gray-400">
      Signed in as
    </p>
    <p class="mt-1 max-w-64 truncate text-sm font-semibold text-gray-800">
      {{accountService.currentUser()?.email}}
    </p>
  </div>

  <button mat-menu-item routerLink="/cart">
    <mat-icon>shopping_cart</mat-icon>
    <span>My Cart</span>
  </button>

  <button mat-menu-item routerLink="/orders">
    <mat-icon>receipt_long</mat-icon>
    <span>My Orders</span>
  </button>

  <mat-divider></mat-divider>

  <button mat-menu-item (click)="logout()" class="!text-red-600">
    <mat-icon class="!text-red-500">logout</mat-icon>
    <span>Logout</span>
  </button>
</mat-menu>
